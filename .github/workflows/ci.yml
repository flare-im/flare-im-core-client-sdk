name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  typescript-sdk:
    name: TypeScript SDK（类型 / 架构 / 单测）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flare-core-typescript-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/flare-core-typescript-sdk/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # 影子视图是本项目的架构红线：可观察视图归 core 所有，
      # 客户端不得自建合并引擎。这条脚本是它的自动化守卫。
      - name: 架构守卫（禁止客户端影子视图）
        run: npm run verify:architecture

      - name: 单元测试
        run: npx vitest run

  spec-consistency:
    name: sdk-spec 契约一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # sdk-spec 是七端契约的唯一真源，各端桩代码由它生成。
      # 这里只校验它自身是合法 JSON 且模块清单与目录一致，
      # 生成物漂移由各端仓库自己的 CI 负责。
      - name: 校验 sdk-spec JSON 合法性
        run: |
          fail=0
          for f in $(find sdk-spec -name '*.json'); do
            if ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "::error file=$f::JSON 解析失败"
              fail=1
            fi
          done
          exit $fail

  example-app-tests:
    name: 示例应用自带测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 这些测试此前**一个都没在 CI 跑过**：CI 只覆盖 typescript-sdk 包、
      # sdk-spec 与 SFC 编译，示例应用自带的套件全在盲区。
      # 代价是真实的——flare-core-tauri-app 的 transport-selector.test.mjs
      # 正则字面量里 `/` 没转义（`/@flare-im/sdk\/tauri/`），整个文件
      # 6 个测试从未被解析执行过，而 `node --test` 只报「1 个失败」，
      # 那个 1 是文件本身加载失败，看起来像一条无关紧要的红。
      #
      # 这些套件都是**纯静态断言**（读源码、比对配置），不需要 SDK 构建产物、
      # 不连后端，所以能在裸 node 上跑，几秒完成。
      # 这一步是 2026-08-20 补的。此前这个 job 是**红的**，而且红得很误导：
      #
      #   ##[notice]flare-core-tauri-app 无 tests 目录，跳过
      #   ── flare-core-electron-app ── # tests 3 / pass 3
      #   ── flare-core-uni-app ── not ok 4 … ENOENT: …/flare-im-design/…
      #
      # 两处都是环境缺失，不是测试真的坏了：
      #   1. flare-core-tauri-app 是**独立仓**，被本仓 .gitignore 刻意排除
      #      （避免变成没有 .gitmodules 的 gitlink）。CI 的 checkout 里根本没有它，
      #      于是清单里点了名的那个 app 被「跳过」——而它恰恰是这个 job 当初为之
      #      建立的那个案例（tauri 的 6 个测试曾因正则未转义从未执行）。
      #   2. uni-app 的 parity 测试要读同级仓 flare-im-design 的源码做比对。
      #
      # 两个仓都是公开仓，直接拉进来，而不是把它们从清单里删掉。
      - name: 拉取测试需要的外部仓
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          # tauri 示例 app（独立仓，本仓 gitignore 排除）
          clone https://github.com/flare-im/flare-core-tauri-demo.git \
            "examples/flare-core-tauri-app"
          # uni-app 的 parity 测试要按同级布局读它的源码
          clone https://github.com/flare-im/flare-im-design.git "../flare-im-design"

      - name: 跑各示例应用的测试套件
        run: |
          fail=0
          for app in flare-core-tauri-app flare-core-electron-app flare-core-uni-app; do
            dir="examples/$app"
            # 点了名却没有 tests 目录 → **判红**，不是 notice 跳过。
            # 「没验到」和「验过没问题」必须是两种结果：上面那个 tauri 就是被
            # 一行 notice 悄悄放过的，而 job 照样在跑别的 app、看起来一切正常。
            if [ ! -d "$dir/tests" ]; then
              echo "::error::$app 在清单里却没有 tests 目录——是仓没拉下来，还是目录改了？"
              fail=1
              continue
            fi
            # 用 nullglob 避免没有匹配时把字面量当文件名传给 node
            files=$(ls "$dir"/tests/*.test.mjs 2>/dev/null || true)
            if [ -z "$files" ]; then
              echo "::error::$app 有 tests 目录却没有 *.test.mjs——测试被删了还是改了后缀？"
              fail=1
              continue
            fi
            echo "── $app ──"
            ( cd "$dir" && node --test tests/*.test.mjs ) || fail=1
          done
          exit $fail

  sfc-gate:
    name: SFC 编译门禁（示例 app）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # vue-tsc 只检查 <script>，模板/样式编译错误会溜过去，
      # 直到 vite build 才炸——而 barrel 导出会让一个坏 SFC 拖垮所有消费方。
      # 这里把每个示例 app 的 src/**/*.vue 全量过一遍编译器。
      - name: 安装 SFC 编译器
        run: npm i --no-save @vue/compiler-sfc

      - name: 编译全部 SFC
        run: node scripts/check-sfc.mjs
